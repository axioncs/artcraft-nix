name: build
on:
  push:
    branches: [main]
    paths:
      - apps.json
      - lib.nix
      - flake.nix
      - flake.lock
      - .github/workflows/build.yml
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Build -deb packages
        run: |
          jq -r 'keys[] | ".#" + . + "-deb"' apps.json \
            | xargs nix build --no-link --keep-going -L
  src:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v16
        with:
          name: artcraft-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build -src packages
        run: |
          jq -r 'to_entries[] | select(.value.ciSkip != true) | ".#" + .key + "-src"' apps.json \
            | xargs nix build --no-link --keep-going -L
